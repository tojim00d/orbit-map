<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project map</title>
<style>
:root{--ink:#292929;--muted:#6b6760;--line:#dedcd7;--paper:#f7f6f3;--card:#fff;--yellow:#ffe24b;--y-soft:#fff5d3;--green:#2e7d55;--g-soft:#e9f6ef;--blue:#2f5da8;--b-soft:#e8effa;--red:#b4452f;--r-soft:#fbece8;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--paper)}
*{box-sizing:border-box}body{margin:0;line-height:1.45}a{color:var(--blue)}
.wrap{max-width:1440px;margin:0 auto;padding:0 32px}
header.hero{background:var(--ink);color:#fff;padding:44px 0 36px}
.hero .row{display:flex;align-items:center;gap:14px;margin-bottom:18px}.hero svg{width:48px;height:48px}
.hero h1{font-size:clamp(30px,4vw,46px);margin:0 0 8px;letter-spacing:-.02em}
.hero p{margin:0;color:#c9c6bf;max-width:900px}.hero b{color:var(--yellow);font-weight:600}
nav.toc{position:sticky;top:0;z-index:30;background:rgba(247,246,243,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
nav.toc .wrap{display:flex;gap:4px;overflow-x:auto;padding-top:9px;padding-bottom:9px;scrollbar-width:none}
nav.toc a{white-space:nowrap;text-decoration:none;font-size:14px;padding:6px 12px;border-radius:999px;color:var(--muted)}nav.toc a:hover{background:var(--y-soft);color:var(--ink)}
section{padding:48px 0 8px;scroll-margin-top:52px}
.kicker{text-transform:uppercase;letter-spacing:.08em;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 6px}
h2{font-size:clamp(24px,2.6vw,32px);margin:0 0 8px}.intro{color:var(--muted);max-width:900px;margin:0 0 24px}
.map-shell{position:relative;overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px}
.map{position:relative;margin-right:64px;display:grid;grid-template-columns:200px 1.15fr 1fr 1.05fr;gap:64px;align-items:start;z-index:1}
.group{border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.group>h3{margin:0;font-size:15px}.group>.sub{margin:-8px 0 2px;font-size:12px;color:var(--muted)}
.g-user{background:#f2f1ee}.g-cnst{background:var(--y-soft)}.g-svc{background:var(--b-soft)}.g-stand{background:var(--g-soft)}
.node{background:#fff;border:1px solid transparent;border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;color:inherit;width:100%;transition:box-shadow .12s,border-color .12s}
.node:hover,.node:focus-visible,.node.hot{border-color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.08);outline:none}
.node strong{display:block;font-size:14px}.node small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{font-size:11px;padding:3px 8px;border-radius:999px;background:var(--paper);border:1px solid var(--line);cursor:pointer;font-family:inherit;color:inherit}
.chip:hover,.chip:focus-visible{background:var(--yellow);border-color:var(--yellow);outline:none}
svg.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;overflow:visible}
svg.wires path{fill:none;stroke-width:1.7;opacity:.75;transition:opacity .12s,stroke-width .12s}
svg.wires path.hot{stroke-width:3;opacity:1}
svg.wires path.k-deploy{stroke:#7aa36f}svg.wires path.k-ctrl{stroke:#c9a92b}svg.wires path.k-sec{stroke:#a57fd0}svg.wires path.k-test{stroke:#6f8fc9}
.badges{position:absolute;inset:0;pointer-events:none;z-index:3}
.badge{position:absolute;pointer-events:auto;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid #fff;cursor:pointer;font-family:inherit;padding:0}
.badge:hover,.badge:focus-visible,.badge.hot{background:var(--yellow);color:var(--ink);outline:none}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:18px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:22px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.edges{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px;margin-top:20px}
.edge-item{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.edge-item:hover,.edge-item:focus-visible,.edge-item.hot{border-color:var(--ink);outline:none}
.edge-item .n{width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.edge-item b{font-size:13px;display:block}.edge-item span{font-size:12px;color:var(--muted)}
.grid{display:grid;gap:16px}.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;min-width:0}
.card h3{margin:0 0 6px;font-size:16px}.card p,.card li{color:var(--muted);font-size:14px;margin:0}.card ul{margin:6px 0 0;padding-left:18px}
.card .more{margin-top:10px;display:inline-block;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;border:0;background:none;padding:0;font-family:inherit}
.card.clickable{cursor:pointer}.card.clickable:hover{border-color:var(--ink)}
.flow{display:grid;gap:8px;margin:8px 0 0;padding:0;list-style:none}
.flow li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;font-size:14px;color:var(--ink)}
.flow .num{width:26px;height:26px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-size:12px;font-weight:700}
.flow li small{display:block;color:var(--muted);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{background:#f2f1ee;font-weight:600}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88em;background:var(--paper);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}
.table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
footer{padding:56px 0 64px;color:var(--muted);font-size:13px}
dialog{border:0;border-radius:20px;padding:0;width:min(760px,94vw);max-height:88vh;box-shadow:0 30px 80px rgba(0,0,0,.25)}
dialog .head{position:sticky;top:0;background:#fff;display:flex;justify-content:space-between;gap:16px;padding:22px 26px 10px;border-bottom:1px solid var(--line)}
dialog h3{margin:0;font-size:21px}dialog .route{font-size:13px;color:var(--muted);margin-top:4px}
dialog .body{padding:16px 26px 26px;color:#3d3a35;font-size:15px}
dialog .body h4{margin:16px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
dialog .body ul{margin:0;padding-left:20px}dialog .body li{margin:5px 0}
dialog .close{border:0;background:var(--paper);border-radius:999px;width:36px;height:36px;font-size:20px;cursor:pointer;flex:none}
.links{display:grid;gap:6px}.links a{font-size:13px;overflow-wrap:anywhere}
.links .repo{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-right:6px}
@media (max-width:1180px){.c3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:680px){.wrap{padding:0 16px}.c2,.c3{grid-template-columns:1fr}.map-shell{padding:14px}}
.tabs{display:inline-flex;gap:4px;padding:4px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:16px}
.tabs button{border:0;background:transparent;border-radius:9px;padding:8px 16px;font:inherit;font-size:14px;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff}
.schema-shell{background:#fff;border:1px solid var(--line);border-radius:22px;padding:12px;overflow-x:auto}
svg.schema{display:block;width:100%;min-width:1100px;height:auto;font-family:inherit}
.s-band{font-size:22px;font-weight:700;fill:#292929}.s-band-sub{font-size:14px;fill:#6b6760}
.s-node rect{fill:#fff;stroke:#d6d3cc;stroke-width:1.5}.s-node{cursor:pointer}
.s-node:hover rect,.s-node:focus-visible rect{stroke:#292929;stroke-width:2.5}.s-node:focus{outline:none}
.s-title{font-size:19px;font-weight:700;fill:#292929}.s-sub{font-size:14px;fill:#6b6760}
.s-chip rect{fill:#f7f6f3;stroke:#dedcd7}.s-chip text{font-size:13px;fill:#292929}.s-chip{cursor:pointer}
.s-chip:hover rect,.s-chip:focus-visible rect{fill:#ffe24b;stroke:#ffe24b}.s-chip:focus{outline:none}
.s-inner rect{fill:#e9f6ef;stroke:#b9dcc6}.s-inner text{font-size:14px;font-weight:600;fill:#2e7d55}.s-inner{cursor:pointer}
.s-inner:hover rect,.s-inner:focus-visible rect{stroke:#2e7d55;stroke-width:2}.s-inner:focus{outline:none}
.s-libs rect{fill:#fff;stroke:#d8c46a;stroke-dasharray:5 4}.s-libs text{font-size:13px;fill:#6b5a12}.s-libs{cursor:pointer}
.s-libs:hover rect{stroke:#292929}
.s-line{fill:none;stroke-width:2.6}.s-hit{fill:none;stroke:transparent;stroke-width:16}.s-arrow{cursor:pointer}
.s-arrow:hover .s-line,.s-arrow:focus-visible .s-line{stroke-width:4.5}.s-arrow:focus{outline:none}
.s-label{font-size:14px;font-weight:600;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
.s-badge{cursor:pointer}.s-badge circle{stroke:#fff;stroke-width:2.5}.s-badge text{font-size:12px;font-weight:700;fill:#fff;pointer-events:none}
.s-badge:hover circle,.s-badge.hot circle{stroke:#292929}.s-label{cursor:pointer;font-size:13px}
.s-arrow.hot .s-line{stroke-width:4.5}.s-node.hot>rect{stroke:#292929;stroke-width:2.5}
.s-band{font-size:20px}.s-band-sub{font-size:13px}.s-title{font-size:18px}
svg.wires path{fill:none}svg.schema text{user-select:none}
.s-gate .s-line{stroke-width:4}.s-label.s-gate{font-weight:800}
.edge-item.gate{border-color:#c9c5bc;background:#fcfbf8}.gate-tag{display:inline-block;font-style:normal;font-size:11px;font-weight:700;color:var(--ink);background:var(--yellow);border-radius:6px;padding:1px 6px;margin-bottom:3px}
.wires path.gate{stroke-width:3.2}.badge.gate{box-shadow:0 0 0 2px var(--ink)}
dialog::backdrop{background:rgba(41,41,41,.45)}
</style>
</head>

<header class="hero"><div class="wrap">
  <div class="row"><svg viewBox="0 0 64 64" aria-hidden="true"><g fill="#ffe24b"><polygon points="32,19 33.81,26.84 39.78,22.81 36.37,29.86 43,32 36.37,34.14 39.78,41.19 33.81,37.16 32,45 30.19,37.16 24.22,41.19 27.63,34.14 21,32 27.63,29.86 24.22,22.81 30.19,26.84"/></g><g fill="none" stroke="#ffe24b" stroke-width="1.5" stroke-linecap="round"><path d="M32 13V3M41.5 15.5l5-8.6M48.5 22.5l8.6-5M51 32h10M48.5 41.5l8.6 5M41.5 48.5l5 8.6M32 51v10M22.5 48.5l-5 8.6M15.5 41.5l-8.6 5M13 32H3M15.5 22.5l-8.6-5M22.5 15.5l-5-8.6"/></g></svg>

  <h1 id="hero-title"></h1>
  <p id="hero-lead"></p>
</div></header>
<nav class="toc"><div class="wrap" id="toc"></div></nav>
<main class="wrap" id="content"></main>

<script>
// Example: a map of the Orbit pack, built with the project-map skill (English UI).
// Russian version — ../example-ru/. Per project only this file is edited: META, N, CHIP, E, KIND, LAYOUT, PAGES.
const GL = "https://github.com";
const REPO = { orbit: ["tojim00d/Orbit-skills", "main"] };
const R = "orbit";
const SK = n => [R, `plugins/orbit/skills/${n}/SKILL.md`];

// Blocks: [title, caption, "what it is", [how it works...], [[repo,"path"]...], [[chipKey,"label"]...]]
const N = {
  orbit: ["orbit", "entry · picks a route", "Pack entry point: sizes the task and proposes a 3–7 step route.",
    ["A small task is done at once, without the pipeline.", "A big one gets a route of skills in order, each step with its own artifact.", "Command <code>/orbit:orbit &lt;task&gt;</code>."],
    [SK("orbit")]],

  intake: ["Intake", "clarify what's needed", "Turn a fuzzy request into unambiguous requirements.",
    ["Sharp questions one at a time until the goal is clear.", "Business request → structured requirements.", "Idea → agreed design before code."],
    [SK("clarify-task"), SK("shape-idea")], [["grill", "clarify-task"], ["req", "capture-requirements"], ["brain", "shape-idea"]]],
  recon: ["Code recon", "facts from code", "Understand the system from its code, not guesses.",
    ["Knowledge graph: modules and links with <code>file:line</code> evidence.", "Working index: index first, then targeted reading.", "Codebase state: stack, conventions, concerns."],
    [SK("map-knowledge")], [["und", "map-knowledge"], ["graft", "index-code"], ["mapc", "survey-codebase"]]],
  reverse: ["Reverse engineering", "when there are no sources or docs", "Take apart an artifact, binary, web app or API.",
    ["Scope line: whose target and why.", "Findings log: observation / inference / unknown.", "Static before dynamic; run only in isolation."],
    [SK("reverse-app")], [["re", "reverse-app"], ["art", "teardown-artifact"], ["api", "recover-api-spec"]]],
  spec: ["Specification", "spec before code", "Agree on what changes before writing code.",
    ["Conversation → spec.", "OpenSpec: proposal → requirement delta → validate.", "Risks and threats become requirements."],
    [SK("run-spec-loop")], [["tospec", "write-spec"], ["sdd", "run-spec-loop"]]],

  plan: ["Plan", "small tasks", "A detailed implementation plan and slice tickets.", ["Tasks of 2–5 minutes with files and check commands.", "Tickets are vertical slices with dependencies."],
    [SK("plan-steps")], [["wp", "plan-steps"], ["tt", "slice-tickets"]]],
  build: ["Implementation", "test → code → refactor", "Code in small steps with tests.", ["Failing test first.", "Each task to a fresh subagent, with review between tasks."],
    [SK("test-first")], [["tdd", "test-first"], ["sdd2", "delegate-tasks"]]],
  check: ["Verification", "prove it works", "Reviews and checks before the word \"done\".", ["Run the checks and show the output.", "Review code, security and unnecessary complexity."],
    [SK("prove-done")], [["ver", "prove-done"], ["cr", "review-code"], ["sec", "review-security"]]],
  release: ["Release", "MR and deploy", "Finish the branch, open the MR, ship.", ["MR with a description and verification.", "Kubernetes/Helm: render and diff, deploy through git."],
    [SK("open-mr")], [["pr", "open-mr"], ["k8s", "ship-k8s"]]],

  map: ["Project map", "interactive schema", "A map like this one: blocks, links, step numbers, code links.", ["Updated in the same change as the code.", "Command <code>/orbit:map</code>."],
    [SK("project-map")], [["pm", "project-map"], ["sd", "draw-stack"]]],
  memory: ["Memory & hand-over", "knowledge across sessions", "Learnings next to code, hand-over, retros.", ["Bug causes and rejected approaches — in <code>.orbit/learnings/</code>.", "HANDOFF.md for a fresh session."],
    [SK("keep-learnings")], [["trail", "keep-learnings"], ["ho", "handoff-session"]]],
  ops: ["Operations", "see it and fix it", "Observability, runbooks, incidents.", ["Symptom alerts, each with a runbook.", "Incident: mitigate → timeline → postmortem."],
    [SK("handle-incident")], [["mon", "review-observability"], ["inc", "handle-incident"]]],
};

const CHIP = {};
for (const [, node] of Object.entries(N))
  for (const [key, label] of node[5] || []) CHIP[key] = [label, [`Skill <code>${label}</code>. Open the file to read the method.`], [SK(label)]];

// Links: [from, to, kind, "title", "summary", [how it works...], [[repo,"path"]...]]
// Step numbers are set by the engine in reading order: entry → phase ① → transition → phase ② → …
const E = [
  ["orbit", "intake", "r", "Start", "a route for the task", ["A big task starts with clarification."], [SK("orbit")]],
  ["intake", "recon", "r", "Requirements → recon", "what the code has", ["Check requirements against the real code."], []],
  ["recon", "reverse", "r", "No sources → reverse", "artifact, binary, API", ["When there's no code or docs."], [SK("reverse-app")]],
  ["recon", "spec", "r", "Facts → spec", "agree before code", ["The proposal is born from facts."], [SK("write-spec")]],
  ["spec", "plan", "l", "Spec → plan", "spec before code", ["Build starts only after an agreed spec."], [SK("plan-steps")]],
  ["plan", "build", "l", "Plan → code", "task by task", [], []],
  ["build", "check", "l", "Code → verification", "evidence", [], []],
  ["check", "release", "l", "Verification → release", "MR and deploy", [], []],
  ["release", "map", "m", "Release → map", "recorded in the map", ["The map is updated in the same change."], [SK("project-map")]],
  ["map", "memory", "m", "Map → memory", "learnings", [], []],
  ["memory", "ops", "m", "Memory → operations", "runbooks and alerts", [], []],
  ["ops", "intake", "m", "Next loop", "incident or idea → new task", ["The orbit closes: operations produce the next task."], []],
];

const KIND = { r: ["#6f8fc9", "① Understand"], l: ["#7aa36f", "② Build"], m: ["#c9a92b", "③ Operate"] };

const META = {
  lang: "en",
  title: "Orbit — the full project lifecycle",
  kicker: "Orbit · example map",
  mapTitle: "Phases and steps",
  mapIntro: "Phases top to bottom, steps left to right. The number on an arrow is the reading order. A thick ringed arrow is a transition to the next phase. Click a block, chip or arrow.",
  footer: "Built with the project-map skill.",
};

const LAYOUT = {
  top: ["orbit"],
  bands: [
    ["Understand", "the task and the system", ["intake", "recon", "reverse", "spec"]],
    ["Build", "plan → code → verify → release", ["plan", "build", "check", "release"]],
    ["Operate", "map, memory, operations", ["map", "memory", "ops"]],
  ],
  labels: { 0: "start", 4: "spec before code", 8: "into the map", 11: "next loop" },
  footer: "Across all phases: plain-language answers, work within agreed scope, small changes",
};

const PAGES = () => [
  ["use", "How to use", "Commands", "",
    `<div class="table-scroll"><table><thead><tr><th>Command</th><th>What it does</th></tr></thead><tbody>
      <tr><td><code>/orbit:orbit &lt;task&gt;</code></td><td>Pick a route and walk it</td></tr>
      <tr><td><code>/orbit:understand</code></td><td>Understand a repository</td></tr>
      <tr><td><code>/orbit:map</code></td><td>Build a project map</td></tr>
      <tr><td><code>/orbit:reverse</code></td><td>Take apart an app or artifact</td></tr>
    </tbody></table></div>`],
];

</script>
<script>
// Project schema with auto-layout. No hand-set coordinates:
// block sizes, wrapping, rows, bands and arrow routes are computed from N, E and LAYOUT.
// Guarantees: blocks never overlap, text stays inside its box, arrows never cross blocks,
// every arrow has its own lane in a gap, step numbers never collide.

// UI language: META.lang = "en" | "ru" (default "en"). Data texts are written by the author in the same language.
const LANG = (typeof META === "object" && META && META.lang === "ru") ? "ru" : "en";
const I18N = {
  en: { schema: "Schema", block: "Block view", other: "Other", components: "Components", entry: "Entry",
        transition: "transition", back: "return", how: "How it works", links: "Links", where: "Where in code", close: "Close",
        ariaSchema: "Project schema", title: "Project map", kicker: "project map", mapKicker: "Big picture", mapTitle: "Components and links",
        lead: "Click <b>any block, chip or link number</b> to open details and links to files. Hover a block to highlight its links.",
        mapIntro: "Top to bottom by phases or layers. Arrow color — link kind; number — step in reading order. Click a block, chip or arrow for details and code." },
  ru: { schema: "Схема", block: "Блок-схема", other: "Прочее", components: "Компоненты", entry: "Вход",
        transition: "переход", back: "возврат", how: "Как устроено", links: "Связи", where: "Где в коде", close: "Закрыть",
        ariaSchema: "Схема проекта", title: "Карта проекта", kicker: "карта проекта", mapKicker: "Большая схема", mapTitle: "Компоненты и связи",
        lead: "Нажмите на <b>любой блок, чип или номер связи</b>: откроются подробности и ссылки на файлы. Наведите на блок, чтобы подсветить его связи.",
        mapIntro: "Сверху вниз по фазам или слоям. Цвет стрелки — тип связи, номер — шаг по ходу чтения. Нажмите на блок, чип или стрелку, чтобы прочитать подробности и перейти к коду." },
};
const T = I18N[LANG];

const SCHEMA_OPT = { W: 1200, gutter: 250, right: 36, gapX: 44, padY: 28, rowGap: 40, bandGap: 24, lane: 22, minW: 200, maxW: 380, minH: 84 };
const BAND_COLORS = ["#e8effa", "#e9f6ef", "#fff5d3", "#f3ecfb", "#fbece8", "#e6f3f3"];

const CIRCLED = n => n >= 1 && n <= 20 ? String.fromCharCode(0x245F + n) : `${n}.`;

// Block groups: top row (entry) + bands. Blocks not named in LAYOUT go to an "Other" band.
function schemaGroups() {
  const L = typeof LAYOUT === "object" && LAYOUT ? LAYOUT : {};
  const used = new Set();
  const take = ids => (ids || []).filter(id => {
    if (!(id in N)) { console.warn("LAYOUT: no such block in N:", id); return false; }
    if (used.has(id)) return false;
    used.add(id); return true;
  });
  const top = take(L.top);
  const numbered = !L.options || L.options.numberBands !== false;

    const kind = E[r.i][2], gate = schemaSteps().gate[r.i];
    out += `<g class="s-arrow${gate ? " s-gate" : ""}" data-edge="${r.i}" tabindex="0" role="button"><title>${stepNo(r.i)}. ${esc(E[r.i][3])}${gate ? " · " + gate : ""}</title><path d="${d}" class="s-hit"/><path d="${d}" stroke="${col(kind)}" marker-end="url(#${mk(KIND[kind] ? kind : "_")})" class="s-line"/></g>`;
  }
  for (const b of Object.values(S.B)) {
    out += `<g class="s-node" data-node="${b.id}" tabindex="0" role="button"><rect x="${r1(b.x)}" y="${r1(b.y)}" width="${r1(b.w)}" height="${r1(b.h)}" rx="14"/>`;
    b.tl.forEach((l, k) => { out += `<text x="${r1(b.x + 18)}" y="${r1(b.y + 37 + k * 23)}" class="s-title">${esc(l)}</text>`; });
    b.sl.forEach((l, k) => { out += `<text x="${r1(b.x + 18)}" y="${r1(b.y + 38 + b.tl.length * 23 + k * 19)}" class="s-sub">${esc(l)}</text>`; });
    for (const c of b.cp) {
      const cx = b.x + 18 + c.dx, cy = b.y + b.textH + 10 + c.dy;
      out += `<g class="s-chip" data-chip="${c.key}" tabindex="0" role="button"><rect x="${r1(cx)}" y="${r1(cy)}" width="${r1(c.w)}" height="26" rx="13"/><text x="${r1(cx + c.w / 2)}" y="${r1(cy + 18)}" text-anchor="middle">${esc(c.text)}</text></g>`;
    }
    out += `</g>`;
  }
  for (const r of S.routes) {
    const [bx, by] = r.badge, c = col(E[r.i][2]);
    const gate = schemaSteps().gate[r.i], n = stepNo(r.i);
    out += `<g class="s-badge${gate ? " s-gate" : ""}" data-edge="${r.i}"><title>${n}. ${esc(E[r.i][3])}${gate ? " · " + gate : ""}</title>${gate ? `<circle cx="${r1(bx)}" cy="${r1(by)}" r="15" fill="#fff" stroke="${c}" stroke-width="2"/>` : ""}<circle cx="${r1(bx)}" cy="${r1(by)}" r="12" fill="${c}"/><text x="${r1(bx)}" y="${r1(by + 4)}" text-anchor="middle">${n}</text></g>`;
    if (r.label) out += `<text x="${r1(r.label[0])}" y="${r1(r.label[1] + 4.5)}" fill="${c}" class="s-label${gate ? " s-gate" : ""}" data-edge="${r.i}">${esc(r.text)}</text>`;
  }
  if (S.footer) {
    const f = S.footer;
    out += `<g class="s-libs" ${f.node ? `data-node="${f.node}" tabindex="0" role="button"` : ""}><rect x="${f.x}" y="${r1(f.y)}" width="${r1(f.w)}" height="${r1(f.h)}" rx="14"/>${f.lines.map((l, k) => `<text x="${r1(f.x + f.w / 2)}" y="${r1(f.y + 26 + k * 18)}" text-anchor="middle">${esc(l)}</text>`).join("")}</g>`;
  }
  host.innerHTML = out + "</svg>";
}

</script>
<script>
// Map page engine: header, menu, sections, "Schema / Block view" tabs, wires and cards.
// Nothing here is edited per project: all content comes from project-data.js (META, N, E, CHIP, KIND, LAYOUT, PAGES).
// UI strings come from I18N in project-schema.js (META.lang = "en" | "ru").
const M = Object.assign({ title: T.title, kicker: T.kicker, lead: T.lead, mapKicker: T.mapKicker, mapTitle: T.mapTitle, mapIntro: T.mapIntro, footer: "" }, typeof META === "object" ? META : {});
document.documentElement.lang = LANG;

const link = (repo, path) => {
  const [proj, ref] = REPO[repo], kind = path.endsWith("/") ? "tree" : "blob", p = path.replace(/\/$/, "");
  return /github\.com/.test(GL) ? `${GL}/${proj}/${kind}/${ref}/${p}` : `${GL}/${proj}/-/${kind}/${ref}/${p}`;
};
const files = list => list && list.length ? `<div class="links">${list.map(([r, p]) => `<a href="${link(r, p)}" target="_blank" rel="noreferrer"><span class="repo">${r}</span>${p}</a>`).join("")}</div>` : "";
const bullets = items => items && items.length ? `<ul>${items.map(i => `<li>${i}</li>`).join("")}</ul>` : "";
const flow = steps => `<ol class="flow">${steps.map(([t, s], i) => `<li><span class="num">${i + 1}</span><span>${t}${s ? `<small>${s}</small>` : ""}</span></li>`).join("")}</ol>`;
const mod = (title, items, paths) => `<div class="card"><h3>${title}</h3>${bullets(items)}<div style="margin-top:10px">${files(paths)}</div></div>`;
const nodeHtml = id => {
  const [title, sub, , , , chips] = N[id];
  return `<div class="node" role="button" tabindex="0" data-node="${id}"><strong>${title}</strong><small>${sub}</small>${chips ? `<div class="chips">${chips.map(([k, l]) => `<button type="button" class="chip" data-chip="${k}">${l}</button>`).join("")}</div>` : ""}</div>`;
};
const group = (g, title, sub, ids) => `<div class="group" style="background:${g}"><h3>${title}</h3>${sub ? `<div class="sub">${sub}</div>` : ""}${ids.map(nodeHtml).join("")}</div>`;

// Header, menu and sections.
document.title = M.title.replace(/<[^>]*>/g, "");
document.getElementById("hero-kicker").innerHTML = M.kicker;
document.getElementById("hero-title").innerHTML = M.title;
document.getElementById("hero-lead").innerHTML = M.lead;
document.getElementById("page-footer").innerHTML = M.footer;

const GROUPS = schemaGroups();
const blockGroups = (GROUPS.top.ids.length ? [GROUPS.top] : []).concat(GROUPS.bands);
const legend = `<div class="legend">${Object.values(KIND).map(([c, l]) => `<span><i style="background:${c}"></i>${l}</span>`).join("")}</div>`;
const SECTIONS = [
  ["map", M.mapKicker, M.mapTitle, M.mapIntro,
    `<div class="tabs" role="tablist"><button type="button" role="tab" aria-selected="true" data-tab="schema">${T.schema}</button><button type="button" role="tab" aria-selected="false" data-tab="block">${T.block}</button></div>
    <div class="tab-panel" data-panel="schema"><div class="schema-shell" id="schema"></div>${legend}</div>
    <div class="tab-panel" data-panel="block" hidden><div class="map-shell"><div class="map" id="map" style="grid-template-columns:repeat(${blockGroups.length},minmax(210px,1fr));min-width:${blockGroups.length * 270}px">
      ${blockGroups.map(g => group(g.color, g.title, g.sub, g.ids)).join("")}
    </div><svg class="wires" id="wires"></svg><div class="badges" id="badges"></div></div>${legend}</div>
    <div class="edges">${schemaSteps().order.map(i => { const e = E[i], gate = schemaSteps().gate[i]; return `<button type="button" class="edge-item${gate ? " gate" : ""}" data-edge="${i}"><span class="n" style="background:${(KIND[e[2]] || ["#292929"])[0]}">${stepNo(i)}</span><span>${gate ? `<em class="gate-tag">${gate}</em>` : ""}<b>${e[3]}</b><span>${e[4]}</span></span></button>`; }).join("")}</div>`],
  ...(typeof PAGES === "function" ? PAGES() : []),
];
document.getElementById("content").innerHTML = SECTIONS.map(([id, kicker, title, intro, html]) =>
  `<section id="${id}"><p class="kicker">${kicker}</p><h2>${title}</h2>${intro ? `<p class="intro">${intro}</p>` : ""}${html}</section>`).join("");
document.getElementById("toc").innerHTML = SECTIONS.map(([id, kicker, title]) => `<a href="#${id}">${id === "map" ? T.schema : kicker || title}</a>`).join("");

renderSchema(document.getElementById("schema"));
document.querySelectorAll("[data-tab]").forEach(tab => tab.addEventListener("click", () => {
  document.querySelectorAll("[data-tab]").forEach(t => t.setAttribute("aria-selected", String(t === tab)));
  document.querySelectorAll("[data-panel]").forEach(p => { p.hidden = p.dataset.panel !== tab.dataset.tab; });
  if (tab.dataset.tab === "block") draw();
}));

// Block-view wires: one curve per link; ends spread along the block side; numbers never collide.
const shell = document.querySelector(".map-shell"), wires = document.getElementById("wires"), badges = document.getElementById("badges");
function draw() {
  if (!shell || shell.offsetParent === null) return;
  wires.innerHTML = ""; badges.innerHTML = "";
  wires.style.width = shell.scrollWidth + "px"; wires.style.height = shell.scrollHeight + "px";
  const base = shell.getBoundingClientRect(), sx = shell.scrollLeft;
  const box = id => {
    const r = shell.querySelector(`.map [data-node="${id}"]`).getBoundingClientRect();
    return { l: r.left - base.left + sx, r: r.right - base.left + sx, cx: (r.left + r.right) / 2 - base.left + sx, cy: (r.top + r.bottom) / 2 - base.top };
  };
  const back = i => !!schemaSteps().back[i];
  const ends = E.map(([f, t], i) => {
    if (!(f in N) || !(t in N) || back(i)) return null;
    const a = box(f), b = box(t);
    if (Math.abs(a.cx - b.cx) < 40) return [a, "r", b, "r"]; // a link inside one column bulges right into the gap
    return a.cx < b.cx ? [a, "r", b, "l"] : [a, "l", b, "r"];
  });
  const slots = {};
  ends.forEach((e, i) => { if (!e) return; (slots[E[i][0] + e[1]] ??= []).push([i, 0]); (slots[E[i][1] + e[3]] ??= []).push([i, 1]); });
  const off = {};
  Object.values(slots).forEach(list => list.forEach(([i, end], k) => { off[`${i}-${end}`] = (k - (list.length - 1) / 2) * 10; }));
  const pt = (n, side, o) => [side === "r" ? n.r : n.l, n.cy + o];
  const placed = [];
  ends.forEach((e, i) => {
    if (!e) return;
    const [a, sa, b, sb] = e;
    const [x1, y1] = pt(a, sa, off[`${i}-0`]), [x2, y2] = pt(b, sb, off[`${i}-1`]);
    const same = sa === sb, dx = same ? 22 + Math.min(30, Math.abs(y2 - y1) * .12) : Math.max(36, Math.abs(x2 - x1) / 2);
    const c1 = [x1 + (sa === "r" ? dx : -dx), y1], c2 = [x2 + (sb === "r" ? dx : -dx), y2];
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", `M${x1},${y1} C${c1} ${c2} ${x2},${y2}`);
    p.setAttribute("stroke", (KIND[E[i][2]] || ["#8a857c"])[0]); p.dataset.edge = i; if (schemaSteps().gate[i]) p.classList.add("gate");
    wires.appendChild(p);
    const len = p.getTotalLength();
    let t = .5, q = p.getPointAtLength(len * t);
    for (let k = 0; k < 14 && placed.some(([x, y]) => Math.hypot(x - q.x, y - q.y) < 27); k++) {
      t = .5 + (k % 2 ? 1 : -1) * Math.ceil((k + 1) / 2) * .06; q = p.getPointAtLength(len * t);
    }
    placed.push([q.x, q.y]);
    const badge = document.createElement("button");
    badge.type = "button"; badge.className = "badge"; badge.dataset.edge = i; badge.textContent = stepNo(i); badge.title = E[i][3]; if (schemaSteps().gate[i]) badge.classList.add("gate");
    badge.style.left = `${q.x}px`; badge.style.top = `${q.y}px`; badge.style.background = (KIND[E[i][2]] || ["#292929"])[0];
    badges.appendChild(badge);
  });
  if (!wires.querySelector("#wire-arrow")) wires.insertAdjacentHTML("afterbegin", `<defs><marker id="wire-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a857c"/></marker></defs>`);
  drawBack(placed);
}
window.addEventListener("resize", () => requestAnimationFrame(draw));
// Backward links (next loop, return to an earlier phase): dashed along the bottom and up the gap left of the target.
function drawBack(placed) {
  const base = shell.getBoundingClientRect(), sx = shell.scrollLeft;
  const mapEl = shell.querySelector(".map"), mb = mapEl.getBoundingClientRect();
  let k = 0;
  E.forEach(([f, t], i) => {
    if (!schemaSteps().back[i] || !(f in N) || !(t in N)) return;
    const rect = id => shell.querySelector(`.map [data-node="${id}"]`).getBoundingClientRect();
    const a = rect(f), b = rect(t), col = shell.querySelector(`.map [data-node="${t}"]`).closest(".group").getBoundingClientRect();
    const X = v => v - base.left + sx, Y = v => v - base.top;
    const yb = Y(mb.bottom) + 18 + k * 12, xg = X(col.left) - 14 - k * 8, k0 = k++;
    const x1 = X((a.left + a.right) / 2), y1 = Y(a.bottom), y2 = Y((b.top + b.bottom) / 2), x2 = X(b.left);
    const d = `M${x1},${y1} V${yb} H${xg} V${y2} H${x2}`;
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", d); p.setAttribute("stroke", (KIND[E[i][2]] || ["#8a857c"])[0]); p.setAttribute("stroke-dasharray", "6 5");
    p.setAttribute("marker-end", "url(#wire-arrow)"); p.dataset.edge = i; p.classList.add("gate", "back");
    wires.appendChild(p);
    const badge = document.createElement("button");
    badge.type = "button"; badge.className = "badge gate"; badge.dataset.edge = i; badge.textContent = stepNo(i); badge.title = E[i][3];
    badge.style.left = `${(x1 + xg) / 2}px`; badge.style.top = `${yb}px`; badge.style.background = (KIND[E[i][2]] || ["#292929"])[0];
    badges.appendChild(badge);
  });
  if (k) { shell.style.paddingBottom = `${30 + k * 12}px`; wires.style.height = shell.scrollHeight + "px"; }
}

// Highlighting and cards.
const toggle = (sel, on) => document.querySelectorAll(sel).forEach(x => x.classList.toggle("hot", on));
function hotNode(id, on) { toggle(`[data-node="${id}"]`, on); E.forEach((e, i) => { if (e[0] === id || e[1] === id) toggle(`[data-edge="${i}"]`, on); }); }
function hotEdge(i, on) { toggle(`[data-edge="${i}"]`, on); toggle(`[data-node="${E[i][0]}"]`, on); toggle(`[data-node="${E[i][1]}"]`, on); }
for (const [type, on] of [["mouseover", true], ["mouseout", false]])
  document.addEventListener(type, e => {
    if (e.target.closest("[data-chip]")) return;
    const d = e.target.closest("[data-edge]"); if (d) return hotEdge(+d.dataset.edge, on);
    const n = e.target.closest("[data-node]"); if (n) hotNode(n.dataset.node, on);
  });

const dlg = document.getElementById("dlg");
function show(title, route, html) {
  document.getElementById("dlg-title").innerHTML = title;
  document.getElementById("dlg-route").innerHTML = route;
  document.getElementById("dlg-body").innerHTML = html;
  dlg.showModal();
}
function openNode(id) {
  const [title, sub, what, how, paths] = N[id];
  const related = E.map((e, i) => [e, i]).filter(([e]) => e[0] === id || e[1] === id).sort((a, b) => stepNo(a[1]) - stepNo(b[1]));
  show(title, sub, `<p>${what || ""}</p>${how && how.length ? `<h4>${T.how}</h4>${bullets(how)}` : ""}${related.length ? `<h4>${T.links}</h4>${bullets(related.map(([e, i]) => `<a href="#" data-edge-link="${i}">${stepNo(i)}. ${e[3]}</a> — ${e[4]}`))}` : ""}${paths && paths.length ? `<h4>${T.where}</h4>${files(paths)}` : ""}`);
}
function openEdge(i) {
  const [from, to, kind, title, summary, how, paths] = E[i];
  const gate = schemaSteps().gate[i];
  show(`${stepNo(i)}. ${title}`, `${N[from][0]} → ${N[to][0]} · ${(KIND[kind] || ["", kind])[1]}${gate ? " · " + gate : ""}`, `<p>${summary || ""}</p>${how && how.length ? `<h4>${T.how}</h4>${bullets(how)}` : ""}${paths && paths.length ? `<h4>${T.where}</h4>${files(paths)}` : ""}`);
}
function openChip(key) {
  if (!(key in CHIP)) return key in N ? openNode(key) : undefined;
  const [title, items, paths] = CHIP[key];
  show(title, "", `${bullets(items)}${paths && paths.length ? `<h4>${T.where}</h4>${files(paths)}` : ""}`);
}
document.addEventListener("click", e => {
  const chip = e.target.closest("[data-chip]"); if (chip) { e.stopPropagation(); return openChip(chip.dataset.chip); }
  const edgeLink = e.target.closest("[data-edge-link]"); if (edgeLink) { e.preventDefault(); return openEdge(+edgeLink.dataset.edgeLink); }
  const edge = e.target.closest("[data-edge]"); if (edge) return openEdge(+edge.dataset.edge);
  const node = e.target.closest("[data-node]"); if (node) return openNode(node.dataset.node);
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const t = e.target;
  if (t.matches("[data-chip]")) { e.preventDefault(); openChip(t.dataset.chip); }
  else if (t.matches("[data-edge]")) { e.preventDefault(); openEdge(+t.dataset.edge); }
  else if (t.matches("[data-node]")) { e.preventDefault(); openNode(t.dataset.node); }
});
dlg.querySelector(".close").setAttribute("aria-label", T.close);
dlg.querySelector(".close").addEventListener("click", () => dlg.close());
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });

</script>
</body>
</html>
