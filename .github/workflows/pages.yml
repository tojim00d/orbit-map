name: Publish Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    name: Sync docs/ to gh-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish docs/ to the gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/site && mkdir -p /tmp/site
          cp -R docs/. /tmp/site/
          cd /tmp/site
          git init -q -b gh-pages
          git config user.name "tojim00d"
          git config user.email "120990901+tojim00d@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: docs snapshot from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
